org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# buildOutputDir — 빌드 산출물을 프로젝트 밖으로 빼는 옵션 (이유는 build.gradle.kts 주석).
#   PC마다 다른 값이라 여기 적지 않습니다. 필요하면 사용자 홈에 적으세요:
#     ~/.gradle/gradle.properties  →  buildOutputDir=C:/AndroidBuild
#   적지 않으면 평소처럼 프로젝트 안의 build/ 를 씁니다.
